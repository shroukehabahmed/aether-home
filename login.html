<div class="relative group">

</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-variant border-none rounded-lg text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/40 focus:bg-surface-bright transition-all duration-300" placeholder="name@aether.home" type="email"/>
</div>
</div>

<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-label text-xs uppercase tracking-widest text-on-surface-variant">

<a class="text-xs font-semibold text-primary hover:text-primary-fixed transition-colors" href="reset-password.html">

                        </a>

<input class="w-full h-14 pl-12 pr-12 bg-surface-variant border-none rounded-lg text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/40 focus:bg-surface-bright transition-all duration-300" placeholder="••••••••" type="password"/>

<span class="material-symbols-outlined text-[20px]">visibility</span>
