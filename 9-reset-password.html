<style>
    .glass-card {
      background: rgba(37, 37, 40, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex justify-between items-center w-full px-8 py-6 z-50">
<div class="text-2xl font-bold tracking-tighter text-[#fefbfe] font-headline">Aether Home</div>
<div class="flex gap-4">
<button class="text-[#acaaad] hover:text-[#fefbfe] transition-colors scale-95 duration-200">
<span class="material-symbols-outlined">help_outline</span>
</button>
<button class="text-[#acaaad] hover:text-[#fefbfe] transition-colors scale-95 duration-200">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex items-center justify-center relative px-6">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[60%] h-[80%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[50%] h-[60%] rounded-full bg-tertiary/5 blur-[100px]"></div>
</div>
<!-- Reset Password Card -->
<section class="glass-card relative z-10 w-full max-w-md p-10 rounded-xl flex flex-col items-center">
<!-- Icon/Identity Anchor -->
<div class="w-16 h-16 mb-8 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">lock_reset</span>
</div>
<h1 class="font-headline text-3xl font-bold tracking-tight text-center mb-2">Reset Password</h1>
<p class="text-on-surface-variant text-sm text-center mb-8 px-4 leading-relaxed">
        Enter your registered email address below. We'll send a secure link to curate a new digital key for your sanctuary.
      </p>
<form class="w-full space-y-6">
<div class="space-y-2">
<label class="text-xs uppercase tracking-widest font-medium text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full bg-surface-variant border-none rounded-lg px-5 py-4 text-on-surface placeholder:text-outline focus:ring-0 focus:bg-surface-bright transition-all duration-300 outline-none" id="email" placeholder="curator@aether.home" type="email"/>
<div class="absolute inset-0 rounded-lg pointer-events-none group-focus-within:ring-1 group-focus-within:ring-primary/20 transition-all"></div>
</div>
</div>
<button class="w-full py-4 rounded-lg font-headline font-bold text-on-primary bg-gradient-to-br from-primary to-primary-container hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-primary/10" type="button">
          Send Reset Link
        </button>
</form>
<div class="mt-8 pt-6 w-full flex flex-col items-center gap-4">
<a class="text-on-surface-variant text-sm hover:text-primary transition-colors flex items-center gap-2 group" href="login.html">
<span class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
          Return to Login
        </a>
</div>
</section>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full flex justify-between items-center w-full px-12 py-8 z-50">
<div class="text-sm font-bold text-[#fefbfe] font-headline">Aether</div>
<div class="flex gap-8">
<a class="font-manrope text-xs uppercase tracking-widest text-[#48474a] hover:text-[#85adff] opacity-80 hover:opacity-100 transition-opacity" href="#">Privacy</a>
<a class="font-manrope text-xs uppercase tracking-widest text-[#48474a] hover:text-[#85adff] opacity-80 hover:opacity-100 transition-opacity" href="#">Terms</a>
<a class="font-manrope text-xs uppercase tracking-widest text-[#48474a] hover:text-[#85adff] opacity-80 hover:opacity-100 transition-opacity" href="#">Support</a>
</div>
<div class="hidden md:block font-manrope text-xs uppercase tracking-widest text-[#48474a]">

</footer>
