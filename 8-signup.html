<!-- Background Ambiance -->
<div class="fixed inset-0 -z-10 bg-mesh opacity-60"></div>
<div class="fixed inset-0 -z-10" data-alt="abstract deep blue and violet ethereal light patterns with soft grain texture and cinematic atmosphere" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDYro7x-kbpw1zIQ-3WSiDBOVEwp0W0FR2qyzJ9kEoYbQINygBaxPb1H2HHpO0Jo8zWl9puG5FMwkOjNYaR2HayS05XSys3YbprISF60mkP10u0ciw8ky5NKvvcz2LIvtAhqADGWK0TCkBbdkBszyBp0yrQOqo8CdhevK7BF-h0DEm7_tWwfwoDldzvfRauOr1gPyXWnc3nCASEsTn8h7-LXqUd3j-ug546kCNnWZeIvf4_a80WQaWle54-npnAgh-J_G045DliK69n'); background-size: cover; background-position: center; mix-blend-mode: overlay; opacity: 0.15;"></div>
<!-- Header Navigation (Simplified for Signup) -->
<header class="fixed top-0 w-full flex justify-between items-center px-8 py-6 z-50">
<div class="text-2xl font-bold tracking-tighter text-[#fefbfe] font-headline">Aether Home</div>
<div class="flex items-center gap-6">
<span class="text-xs uppercase tracking-widest text-on-surface-variant font-headline">The Digital Curator</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative min-h-screen flex items-center justify-center p-6">
<!-- Decoration Elements -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/5 rounded-full blur-[120px]"></div>
<section class="w-full max-w-xl">
<!-- Editorial Pairing -->
<div class="mb-12 text-center">
<h1 class="font-headline text-5xl md:text-6xl font-extrabold tracking-tight mb-4">Create your space.</h1>
<p class="text-on-surface-variant text-sm font-label uppercase tracking-[0.2em]">Begin your curation journey</p>
</div>
<!-- Glassmorphism Container -->
<div class="glass-card p-10 rounded-xl shadow-2xl relative">
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="block text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest pl-1">Full Name</label>
<div class="relative group">
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 text-on-surface placeholder-outline focus:ring-0 focus:bg-surface-bright transition-all duration-300" placeholder="Julianne Moore" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest pl-1">Email Address</label>
<div class="relative group">
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 text-on-surface placeholder-outline focus:ring-0 focus:bg-surface-bright transition-all duration-300" placeholder="curator@aether.home" type="email"/>
</div>
</div>
<!-- Password Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest pl-1">Password</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 text-on-surface placeholder-outline focus:ring-0 focus:bg-surface-bright transition-all duration-300" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-2">
<label class="block text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest pl-1">Confirm</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-5 py-4 text-on-surface placeholder-outline focus:ring-0 focus:bg-surface-bright transition-all duration-300" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action -->
<div class="pt-4">
<button type="button" onclick="window.location.href='index.html'" class="w-full py-5 rounded-lg bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-bold text-lg tracking-tight hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 shadow-lg shadow-primary/10">
                            Sign Up
                        </button>
</div>
<div class="pt-4 text-center">
<p class="text-on-surface-variant text-sm">
                            Already have an account? 
                            <a class="text-primary hover:text-primary-fixed font-semibold ml-1 transition-colors" href="login.html">Sign In</a>
</p>
